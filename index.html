  function gemerkt() { try { return localStorage.getItem(NAME) || sessionStorage.getItem(NAME); } catch (e) { return null; } }
  function vergessen() { try { localStorage.removeItem(NAME); sessionStorage.removeItem(NAME); } catch (e) { /* nichts */ } }
  function entschluesseln(roh) {
    return crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(C.iv) }, k, bytes(C.daten)); })
      .then(function (klar) { return new TextDecoder().decode(klar); });
  }
  function zeigen(html) {
    if (C.zuletzt && window.top === window) {
      try {
        var l = JSON.parse(localStorage.getItem("unterricht:zuletzt") || "[]").filter(function (z) { return z !== C.ziel; });
        l.unshift(C.ziel); localStorage.setItem("unterricht:zuletzt", JSON.stringify(l.slice(0, 8)));
      } catch (e) { /* nichts */ }
    }
    // Erst wenn die Hülle fertig geladen ist, ersetzt document.open() sie ganz (sonst hängt der Browser die Seite nur an)
    var ersetzen = function () { setTimeout(function () { document.open(); document.write(html); document.close(); }, 0); };
    if (document.readyState === "complete") ersetzen(); else addEventListener("load", ersetzen, { once: true });
  }
  function formular(text) {
    el("warte").style.display = "none"; el("anmeldung").style.display = "block"; el("meldung").textContent = text || "";
    el("pw").focus();
  }
  if (!window.crypto || !crypto.subtle || !window.TextDecoder) {
    el("warte").textContent = "Dieser Browser kann die Seite nicht öffnen. Bitte die Adresse mit https:// aufrufen oder einen aktuellen Browser nehmen.";
    return;
  }
  el("anmeldung").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = el("pw").value; if (!pw) return;
    el("los").disabled = true; el("meldung").style.color = "#5b6472"; el("meldung").textContent = "Wird geprüft …";
    var roh;
    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (basis) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(C.salz), iterations: C.iter, hash: "SHA-256" }, basis, 256); })
      .then(function (bits) { roh = new Uint8Array(bits); return entschluesseln(roh); })
      .then(function (html) {
        try { (el("merken").checked ? localStorage : sessionStorage).setItem(NAME, text64(roh)); } catch (x) { /* nur diese Seite */ }
        zeigen(html);
      }, function () {
        el("los").disabled = false; el("meldung").style.color = ""; el("meldung").textContent = "Das Passwort passt nicht.";
        el("pw").select();
      });
  });
  var s = gemerkt();
  if (s) entschluesseln(bytes(s)).then(zeigen, function () { vergessen(); formular("Bitte das Passwort neu eingeben."); });
  else formular();
})();
</script>
